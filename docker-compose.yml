services:
  admin-portal-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: picc-pp-admin-portal-frontend:latest
    container_name: admin-portal-frontend
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=${PORT:-8080}
      - VITE_BASE_URL=${VITE_BASE_URL:-/nnp-admin/}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
